image: php:8.2-cli-alpine

stages:
  - test
  - build

cache:
  paths:
    - vendor/

before_script:
  - apk add --no-cache curl unzip
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

test:
  stage: test
  script:
    - composer install --prefer-dist --no-progress
    - ./vendor/bin/pest || echo "No tests defined yet"

docker-build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t ferrox/php-gateway:$CI_COMMIT_SHA .
