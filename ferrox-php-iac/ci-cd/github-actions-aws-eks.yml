name: Ferrox AWS EKS CI/CD

on:
  push:
    branches:
      - master
      - main

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: ferrox-app
  EKS_CLUSTER_NAME: ferrox-cluster

jobs:
  build-and-deploy:
    name: Build Docker, Apply Terraform, Deploy K8s
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 2. Terraform IaC Apply (Idempotent)
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    
    - name: Terraform Init & Apply
      working-directory: ferrox-php-iac/terraform/aws-eks
      run: |
        terraform init
        terraform apply -auto-approve

    # 3. Docker Build & Push to ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Docker image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f ferrox-php-iac/docker/Dockerfile.production .
        docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    # 4. K8s Deploy (Zero Downtime)
    - name: Update Kubeconfig
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Deploy to Kubernetes
      run: |
        # Substitute image tag using kustomize or sed
        sed -i "s|registry.gitlab.com/your-org/ferrox-app:latest|${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}|g" ferrox-php-iac/k8s/deployment.yaml
        kubectl apply -f ferrox-php-iac/k8s/deployment.yaml
        kubectl rollout status deployment/ferrox-app
