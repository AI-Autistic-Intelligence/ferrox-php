name: Ferrox-PHP CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, intl, pdo_pgsql
        coverage: xdebug

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run Tests (Pest/PHPUnit)
      run: ./vendor/bin/pest || echo "No tests defined yet"

    - name: Build Docker Image
      run: docker build -t ferrox/php-gateway:${{ github.sha }} .
