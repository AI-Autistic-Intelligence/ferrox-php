name: Ferrox GCP GKE CI/CD

on:
  push:
    branches:
      - master
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: europe-west1
  GAR_LOCATION: europe-west1
  GAR_REPOSITORY: ferrox-repo
  IMAGE_NAME: ferrox-app
  GKE_CLUSTER: ferrox-cluster

jobs:
  build-and-deploy:
    name: Build Docker, Apply Terraform, Deploy K8s
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. GCP Authentication (Workload Identity Federation)
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # 2. Terraform IaC Apply (Idempotent)
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    
    - name: Terraform Init & Apply
      working-directory: ferrox-php-iac/terraform/gcp-gke
      run: |
        terraform init
        terraform apply -var="gcp_project_id=${{ env.PROJECT_ID }}" -auto-approve

    # 3. Docker Build & Push to GCP Artifact Registry
    - name: Configure Docker for GCP
      run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Build and Push Docker image
      env:
        IMAGE_URI: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      run: |
        docker build -t $IMAGE_URI -f ferrox-php-iac/docker/Dockerfile.production .
        docker push $IMAGE_URI

    # 4. K8s Deploy to GKE (Zero Downtime)
    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GCP_REGION }}

    - name: Deploy to Kubernetes
      env:
        IMAGE_URI: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      run: |
        # Substitute image tag using kustomize or sed
        sed -i "s|registry.gitlab.com/your-org/ferrox-app:latest|${IMAGE_URI}|g" ferrox-php-iac/k8s/deployment.yaml
        kubectl apply -f ferrox-php-iac/k8s/deployment.yaml
        kubectl rollout status deployment/ferrox-app
