version: '3.8'

services:
  eshop-api:
    build:
      context: ../..
      dockerfile: examples/eshop/Dockerfile
    container_name: ferrox-php-eshop
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
      - DATABASE_URL=pgsql:host=postgres;port=5432;dbname=ferrox_eshop
      - DB_USER=ferrox
      - DB_PASSWORD=ferrox_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PASETO_V4_LOCAL_KEY=707172737475767778797a7b7c7d7e7f808182838485868788898a8b8c8d8e8f
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ferrox-network

  postgres:
    image: postgres:16-alpine
    container_name: ferrox-php-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferrox_eshop
      POSTGRES_USER: ferrox
      POSTGRES_PASSWORD: ferrox_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrox -d ferrox_eshop"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ferrox-network

  redis:
    image: redis:7-alpine
    container_name: ferrox-php-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ferrox-network

  prometheus:
    image: prom/prometheus:latest
    container_name: ferrox-php-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ferrox-network

  grafana:
    image: grafana/grafana:latest
    container_name: ferrox-php-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=ferrox_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - ferrox-network

volumes:
  pgdata:

networks:
  ferrox-network:
    driver: bridge
